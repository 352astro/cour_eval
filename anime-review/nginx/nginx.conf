pid .runtime/nginx/nginx.pid;
error_log .runtime/nginx/error.log warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    default_type application/octet-stream;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
    }

    server {
        listen 80;
        root .;
        index index.html;

        location ~ (^|/)\. {
            return 404;
        }

        location ~ ^/(scripts|nginx|supabase)(/|$) {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
